<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panell · Tanda</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest-admin.json">
<script src="../shared/manifest.js?v=6087a0f"></script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/panel.css?v=6087a0f">
<style>
  /* Agenda en quadrícula: files = hores, columnes = cada professional (com un full de càlcul). */
  .ag-switch { display: flex; gap: 6px; margin: 4px 0 10px; }
  .ag-switch button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border, #e5e7eb); background: #fff; font-weight: 700; font-size: .95rem; }
  .ag-switch button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .grid-wrap { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; margin-top: 8px; }
  .agrid { display: grid; position: relative; min-width: 100%; }
  .agrid .gh { position: sticky; top: 0; z-index: 3; background: #f8fafc; border-bottom: 2px solid #e5e7eb; padding: 8px 6px; font-weight: 700; font-size: .85rem; text-align: center; white-space: nowrap; }
  .agrid .gt { font-size: .72rem; color: #64748b; padding: 2px 6px 0; text-align: right; border-right: 1px solid #e5e7eb; background: #f8fafc; position: sticky; left: 0; z-index: 2; }
  .agrid .gt.hour { color: #0f172a; font-weight: 700; }
  .agrid .gc { border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; cursor: pointer; min-height: 22px; }
  .agrid .gc.hour { border-top: 1px solid #e2e8f0; }
  .agrid .gc:hover { background: #f5f3ff; }
  .agrid .gc.off { background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 6px, #f1f5f9 6px, #f1f5f9 12px); cursor: default; }
  .agrid .ga { z-index: 1; margin: 1px 2px; border-radius: 8px; padding: 4px 6px; font-size: .74rem; line-height: 1.2; overflow: hidden; cursor: pointer;
    background: color-mix(in srgb, var(--c-pending, var(--brand)) 16%, #fff); border-left: 4px solid var(--c-pending, var(--brand)); color: #0f172a; }
  .agrid .ga b { display: block; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agrid .ga small { color: #475569; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agrid .ga.feta { background: color-mix(in srgb, var(--c-paid, #16a34a) 18%, #fff); border-left-color: var(--c-paid, #16a34a); }
  .card.s-ready, .card.s-prep { border-top-color: var(--c-pending, var(--ready)); }
  .agrid .ga.no-presentat { background: #fee2e2; border-left-color: #dc2626; text-decoration: line-through; }
  .agrid .ga.online::after { content: '🌐'; float: right; font-size: .7rem; }
  .agrid .now { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 4; pointer-events: none; }
  .agrid .now::before { content: ''; position: absolute; left: 0; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
</style>
</head>
<body>
<header class="p-top"><div class="wrap">
  <div class="p-brand"><div class="p-logo" id="logo">✂️</div><div><b id="bname">…</b><small>Panell de cites</small></div></div>
  <div class="p-actions">
    <a id="public-link" class="hide-m" target="_blank">Pàgina de reserves ↗</a>
    <button id="reset-demo" class="hide-m" hidden onclick="resetDemo()">Reiniciar demo</button>
    <button onclick="Panel.logout('reservafacil', slug)" aria-label="Tancar el panell">🔒</button>
  </div>
</div></header>

<main class="wrap" id="main"></main>
<button class="fab" id="fab" onclick="openNew()">＋ Nova cita</button>

<nav class="p-tabbar" id="tabbar">
  <button data-tab="agenda" class="on"><span>📅</span>Agenda<i class="dot" id="dot" hidden></i></button>
  <button data-tab="clients"><span>👥</span>Clients</button>
  <button data-tab="serveis"><span>✂️</span>Serveis</button>
  <button data-tab="caixa"><span>💶</span>Caixa</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
<script src="../shared/config.js?v=6087a0f"></script>
<script src="../shared/remote.js?v=6087a0f"></script>
<script src="core.js?v=6087a0f"></script>
<script src="../shared/panel.js?v=6087a0f"></script>
<script src="../shared/caixa.js?v=6087a0f"></script>
<script>
  const slug = new URLSearchParams(location.search).get('c') || 'demo';
  const L = 'ca';
  let client, tab = 'agenda', day = toISODate(new Date()), who = 'tots', showDone = false, search = '';
  let knownIds = null, knownCancelled = new Set(); const flashIds = new Set();
  const $ = id => document.getElementById(id);
  const svc = id => client.services.find(s => s.id === id);
  const staff = id => client.staff.find(s => s.id === id);
  const svcName = a => tr(svc(a.serviceId)?.name, L) || a.serviceName;
  const fmtDay = (iso, o = { weekday: 'long', day: 'numeric', month: 'long' }) => fromISODate(iso).toLocaleDateString('ca-ES', o);
  const today = () => toISODate(new Date());
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const dayLabel = iso => iso === today() ? 'Avui' : iso === toISODate(addDays(new Date(), 1)) ? 'Demà' : iso === toISODate(addDays(new Date(), -1)) ? 'Ahir' : '';

  // ---------- Agenda ----------
  function apptCard(a) {
    const end = toHHMM(toMin(a.time) + a.duration);
    const s = staff(a.staffId);
    const started = a.date < today() || (a.date === today() && toMin(a.time) <= nowMin() + 15);
    const cls = a.status === 'confirmada' ? (started ? 's-prep' : 's-ready') : 's-done';
    const tag = { feta: '<span class="tag ok">✓ Ha vingut</span>', 'no-presentat': '<span class="tag bad">No ha vingut</span>', 'cancel·lada': '<span class="tag grey">Cancel·lada</span>' }[a.status]
      || (a.source === 'online' ? '<span class="tag warn">Reserva online</span>' : '');
    return `<div class="card ${cls} ${flashIds.has(a.id) ? 'flash' : ''}">
      <div class="c-head"><div><div class="c-big">${a.time} – ${end}</div><div class="c-name">${esc(a.customer.name)}</div></div>${tag}</div>
      <span class="c-pill">${esc(svc(a.serviceId)?.emoji || '✂️')} ${esc(svcName(a))}</span>
      <div class="c-meta">${esc(s?.avatar || '')} Amb ${esc(s?.name || '')}${a.customer.phone ? ` · <a href="tel:${esc(a.customer.phone)}">📞 ${esc(a.customer.phone)}</a>` : ''}</div>
      ${a.note ? `<div class="c-note">💬 ${esc(a.note)}</div>` : ''}
      <div class="c-foot"><span>Preu</span><b>${fmtPrice(a.price)}</b></div>
      ${a.status === 'confirmada'
        ? (started ? `<button class="bigbtn b-ready" onclick="setStatus('${a.id}','feta')">✅ Ha vingut</button>
             <div class="smallrow"><button onclick="setStatus('${a.id}','no-presentat')">No ha vingut</button><button onclick="askCancel('${a.id}')">Cancel·lar</button></div>`
                   : `<div class="smallrow"><button onclick="askCancel('${a.id}')">Cancel·lar la cita</button></div>`)
        : `<div class="smallrow"><button onclick="setStatus('${a.id}','confirmada')">↩ Desfer</button></div>`}
    </div>`;
  }

  // ---------- Agenda: llista o quadrícula ----------
  let agView = (() => { try { return localStorage.getItem('reservafacil:agview') || 'llista'; } catch (_) { return 'llista'; } })();
  function setAgView(v) { agView = v; try { localStorage.setItem('reservafacil:agview', v); } catch (_) {} render(); }
  const agSwitch = () => `<div class="ag-switch"><button class="${agView === 'llista' ? 'on' : ''}" onclick="setAgView('llista')">📋 Llista</button><button class="${agView === 'graella' ? 'on' : ''}" onclick="setAgView('graella')">🗓️ Quadrícula</button></div>`;

  // Quadrícula del dia: una columna per professional, una fila cada 15 minuts (o cada "slotMinutes" si és més petit).
  function gridView(people) {
    const step = Math.min(15, client.slotMinutes || 15);
    const ranges = people.map(p => staffRanges(client, p, day));
    const all = ranges.flat();
    if (!all.length) return '';
    const start = Math.floor(Math.min(...all.map(r => r[0])) / 60) * 60, end = Math.ceil(Math.max(...all.map(r => r[1])) / 60) * 60;
    const rows = (end - start) / step, rowOf = m => Math.round((m - start) / step) + 2;   // fila 1 = capçalera
    const appts = Store.getAppts(slug).filter(a => a.date === day && a.status !== 'cancel·lada');
    let html = `<div class="gh" style="grid-row:1;grid-column:1"></div>` + people.map((p, i) =>
      `<div class="gh" style="grid-row:1;grid-column:${i + 2}">${esc(p.avatar)} ${esc(p.name)}</div>`).join('');
    for (let r = 0; r < rows; r++) {
      const m = start + r * step, hour = m % 60 === 0;
      html += `<div class="gt ${hour ? 'hour' : ''}" style="grid-row:${r + 2};grid-column:1">${hour || step >= 30 ? toHHMM(m) : `<span style="opacity:.6">${toHHMM(m)}</span>`}</div>`;
      people.forEach((p, i) => {
        const open = ranges[i].some(([a, b]) => m >= a && m < b);
        html += `<div class="gc ${hour ? 'hour' : ''} ${open ? '' : 'off'}" style="grid-row:${r + 2};grid-column:${i + 2}" ${open ? `onclick="newAt('${p.id}','${toHHMM(m)}')" title="Nova cita amb ${esc(p.name)} a les ${toHHMM(m)}"` : ''}></div>`;
      });
    }
    for (const a of appts) {
      const col = people.findIndex(p => p.id === a.staffId);
      if (col < 0) continue;
      const r1 = rowOf(toMin(a.time)), r2 = Math.max(r1 + 1, rowOf(toMin(a.time) + a.duration));
      html += `<div class="ga ${a.status} ${a.source === 'online' ? 'online' : ''}" style="grid-row:${r1} / ${r2};grid-column:${col + 2}" onclick="openAppt('${a.id}')">
        <b>${a.time} ${esc(a.customer.name)}</b><small>${esc(svc(a.serviceId)?.emoji || '✂️')} ${esc(svcName(a))} · ${fmtPrice(a.price)}</small></div>`;
    }
    // Línia vermella a l'hora actual
    let nowLine = '';
    if (day === today() && nowMin() >= start && nowMin() <= end) nowLine = `<div class="now" style="top:calc(var(--hdr, 38px) + ${(nowMin() - start) / step} * var(--row, 24px))"></div>`;
    return `<div class="grid-wrap"><div class="agrid" style="grid-template-columns:56px repeat(${people.length}, minmax(120px, 1fr));grid-template-rows:38px repeat(${rows}, 24px);--row:24px;--hdr:38px">${html}${nowLine}</div></div>
      <p class="c-meta" style="margin-top:8px">Toca un forat per posar-hi una cita. Toca una cita per veure-la o marcar-la.</p>`;
  }
  function openAppt(id) {
    const a = Store.getAppts(slug).find(x => x.id === id);
    if (a) Panel.modal(`<div class="cards">${apptCard(a)}</div><div class="p-row"><button class="p-btn sec" onclick="Panel.closeModal()">Tancar</button></div>`);
  }
  // Nova cita des d'un forat de la quadrícula: ja amb el professional, el dia i l'hora triats.
  function newAt(staffId, time) {
    openNew();
    draft.staffId = staffId; draft.date = day; draft.wantTime = time; draft.lockStaff = staffId; draft.lockTime = time;
    const eligible = client.services.filter(s => s.active !== false && client.staff.find(p => p.id === staffId)?.services.includes(s.id));
    if (eligible.length === 1) draft.serviceId = eligible[0].id;
    renderNew();
  }

  function viewAgenda() {
    const all = Store.getAppts(slug).filter(a => a.date === day && (who === 'tots' || a.staffId === who)).sort((x, y) => x.time.localeCompare(y.time));
    const pending = all.filter(a => a.status === 'confirmada');
    const done = all.filter(a => a.status !== 'confirmada');
    const working = client.staff.filter(s => staffRanges(client, s, day).length);
    const revenue = all.filter(a => a.status === 'confirmada' || a.status === 'feta').reduce((s, a) => s + a.price, 0);
    const lbl = dayLabel(day);
    return `${Panel.trialBanner(Store.biz)}${Panel.soundTip()}
      <div class="daynav">
        <button onclick="shiftDay(-1)" aria-label="Dia anterior">←</button>
        <div class="label"><b>${lbl ? lbl + ', ' : ''}${esc(fmtDay(day, lbl ? { day: 'numeric', month: 'long' } : undefined))}</b>
          ${day !== today() ? '<button onclick="day=today();render()">Tornar a avui</button>' : `<span class="c-meta">${all.filter(a => a.status !== 'cancel·lada').length} cites · ${fmtPrice(revenue)}</span>`}</div>
        <button onclick="shiftDay(1)" aria-label="Dia següent">→</button>
      </div>
      ${agSwitch()}
      <div class="chips"><button class="chip ${who === 'tots' ? 'on' : ''}" onclick="who='tots';render()">Tothom</button>
        ${client.staff.map(s => `<button class="chip ${who === s.id ? 'on' : ''}" onclick="who='${s.id}';render()">${esc(s.avatar)} ${esc(s.name)}</button>`).join('')}</div>
      ${!working.length ? `<div class="empty" style="margin-top:16px"><span>🌙</span>Aquest dia està tancat.</div>` : agView === 'graella' ? gridView(working.filter(p => who === 'tots' || p.id === who)) : `
      <div class="group-title">Pendents <span class="n">${pending.length}</span></div>
      ${pending.length ? `<div class="cards">${pending.map(apptCard).join('')}</div>` : `<div class="empty"><span>☕</span>No hi ha cites pendents${day === today() ? ' per avui' : ''}.<br>Quan algú reservi per internet, sonarà i sortirà aquí.</div>`}
      ${done.length ? `<div class="group-title">Acabades o anul·lades <span class="n">${done.length}</span><button class="right" onclick="showDone=!showDone;render()">${showDone ? 'Amagar' : 'Mostrar'}</button></div>
        ${showDone ? `<div class="cards">${done.map(apptCard).join('')}</div>` : ''}` : ''}`}`;
  }
  function shiftDay(n) { day = toISODate(addDays(fromISODate(day), n)); render(); }
  async function setStatus(id, status) {
    try { await Store.updateAppt(slug, id, { status }); } catch (_) { return Panel.toast('⚠️ No s\'ha pogut desar. Revisa la connexió.'); }
    Panel.toast({ feta: '👏 Fet!', 'no-presentat': 'Apuntat: no ha vingut', confirmada: 'Desfet' }[status] || 'Fet');
    if (Panel.modalOpen()) Panel.closeModal();
    render();
  }
  function askCancel(id) {
    const a = Store.getAppts(slug).find(x => x.id === id);
    Panel.ask(`Cancel·lar la cita de ${a.customer.name}?`, `${fmtDay(a.date)} a les ${a.time}. Recorda trucar-li per avisar-lo.`, 'Sí, cancel·lar', async () => {
      try { await Store.updateAppt(slug, id, { status: 'cancel·lada', cancelledBy: 'negoci' }); } catch (_) { return Panel.toast('⚠️ No s\'ha pogut desar. Revisa la connexió.'); }
      Panel.toast('Cita cancel·lada'); render();
    });
  }

  // ---------- Nova cita (pas a pas, tot amb botons) ----------
  let draft = {};
  function openNew() {
    draft = { serviceId: null, staffId: 'any', date: day < today() ? today() : day, time: null, name: '', phone: '' };
    renderNew();
  }
  function renderNew() {
    const active = client.services.filter(s => s.active !== false);
    let html = `<h3>Nova cita</h3><label>1. Quin servei?</label><div class="choices wide">${active.map(s =>
      `<button class="${s.id === draft.serviceId ? 'on' : ''}" onclick="draft.serviceId='${s.id}';draft.staffId=draft.lockStaff&&staff(draft.lockStaff)?.services.includes('${s.id}')?draft.lockStaff:'any';draft.time=null;if(draft.lockTime)draft.wantTime=draft.lockTime;renderNew()">${esc(s.emoji)} ${esc(tr(s.name, L))} · ${s.duration} min · ${fmtPrice(s.price)}</button>`).join('')}</div>`;
    if (draft.serviceId) {
      const eligible = client.staff.filter(p => p.services.includes(draft.serviceId));
      const days = [0, 1, 2, 3, 4, 5, 6].map(i => toISODate(addDays(new Date(), i)));
      if (!days.includes(draft.date)) days.push(draft.date);
      const slots = availableSlots(client, Store.getAppts(slug), draft.date, draft.serviceId, draft.staffId, { respectNotice: false })
        .filter(s => draft.date !== today() || toMin(s.time) >= nowMin() - 30);
      if (draft.wantTime && slots.some(s => s.time === draft.wantTime)) { const w = slots.find(s => s.time === draft.wantTime); draft.time = w.time; draft.slotStaff = w.staffIds; }
      draft.wantTime = null;
      if (draft.time && !slots.some(s => s.time === draft.time)) draft.time = null;
      html += `<label>2. Amb qui?</label><div class="choices">
          ${eligible.length > 1 ? `<button class="${draft.staffId === 'any' ? 'on' : ''}" onclick="draft.staffId='any';renderNew()">Qui estigui lliure</button>` : ''}
          ${eligible.map(p => `<button class="${draft.staffId === p.id ? 'on' : ''}" onclick="draft.staffId='${p.id}';renderNew()">${esc(p.avatar)} ${esc(p.name)}</button>`).join('')}</div>
        <label>3. Quin dia?</label><div class="choices">${days.map(d => `<button class="${d === draft.date ? 'on' : ''}" onclick="draft.date='${d}';draft.time=null;renderNew()">${esc(dayLabel(d) || fmtDay(d, { weekday: 'short', day: 'numeric' }))}</button>`).join('')}</div>
        <p class="c-meta" style="margin-top:6px">Un altre dia: <input type="date" value="${draft.date}" style="width:auto;padding:6px 8px;font-size:1rem" onchange="if(this.value){draft.date=this.value;draft.time=null;renderNew()}"></p>
        <label>4. A quina hora?</label>${slots.length ? `<div class="choices">${slots.map(s => `<button class="${s.time === draft.time ? 'on' : ''}" onclick="draft.time='${s.time}';draft.slotStaff=${JSON.stringify(s.staffIds).replace(/"/g, '&quot;')};renderNew()">${s.time}</button>`).join('')}</div>`
          : '<p>Aquest dia no queda cap hora lliure. Tria un altre dia.</p>'}`;
    }
    if (draft.time) html += `<label for="nn">5. Nom del client</label><input id="nn" value="${esc(draft.name)}" oninput="draft.name=this.value" autocomplete="off">
      <label for="np">Telèfon (per si cal avisar-lo)</label><input id="np" type="tel" inputmode="tel" value="${esc(draft.phone)}" oninput="draft.phone=this.value">`;
    html += `<p id="nerr" style="color:var(--new);font-weight:700;margin-top:10px"></p>
      <div class="p-row"><button class="p-btn sec" onclick="Panel.closeModal()">Tornar</button><button class="p-btn main" ${draft.time ? '' : 'disabled'} onclick="saveNew()">Desar la cita</button></div>`;
    const scroll = document.querySelector('.p-modal')?.scrollTop || 0;
    Panel.modal(html);
    document.querySelector('.p-modal').scrollTop = scroll;
  }
  async function saveNew() {
    if (!draft.name.trim()) { $('nerr').textContent = 'Escriu el nom del client.'; $('nn').focus(); return; }
    const s = svc(draft.serviceId);
    const staffId = draft.staffId === 'any' ? draft.slotStaff[0] : draft.staffId;
    const btn = document.querySelector('.p-modal .p-btn.main'); if (btn) btn.disabled = true;
    const a = await Store.addAppt(client, { serviceId: s.id, serviceName: tr(s.name, 'ca'), staffId, date: draft.date, time: draft.time, duration: s.duration, price: s.price,
      customer: { name: draft.name.trim(), phone: draft.phone.trim(), email: '' }, note: '', source: 'panell' }).catch(() => null);
    if (btn) btn.disabled = false;
    if (!a) { $('nerr').textContent = 'Aquesta hora ja no està lliure. Tria\'n una altra.'; draft.time = null; return; }
    if (knownIds) knownIds.add(a.id);
    Panel.closeModal(); day = draft.date; tab = 'agenda'; who = 'tots';
    Panel.toast('✓ Cita desada'); render();
  }

  // ---------- Clients ----------
  function customers() {
    const map = new Map();
    for (const a of Store.getAppts(slug)) {
      const k = normPhone(a.customer.phone) || a.customer.name.toLowerCase();
      if (!map.has(k)) map.set(k, { key: k, name: a.customer.name, phone: a.customer.phone, email: a.customer.email, appts: [] });
      const c = map.get(k); c.appts.push(a); if (a.customer.email) c.email = a.customer.email;
    }
    return [...map.values()].map(c => {
      const next = c.appts.filter(a => a.date >= today() && a.status === 'confirmada').sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
      const done = c.appts.filter(a => a.status === 'feta');
      return { ...c, visits: done.length, spent: done.reduce((s, a) => s + a.price, 0), noShows: c.appts.filter(a => a.status === 'no-presentat').length, next };
    }).sort((a, b) => a.name.localeCompare(b.name));
  }
  const filterClients = () => { const q = search.trim().toLowerCase(); return customers().filter(c => !q || c.name.toLowerCase().includes(q) || (normPhone(q) && normPhone(c.phone).includes(normPhone(q)))); };
  function viewClients() {
    return `<h2>Clients</h2><p class="sub">Cada persona que reserva té la seva fitxa. Toca-la per veure-ho tot.</p>
      <input id="search" placeholder="🔍 Buscar per nom o telèfon" value="${esc(search)}" oninput="search=this.value;$('clist').innerHTML=clientItems(filterClients())" style="width:100%;font-size:1.1rem;padding:14px;border:2px solid var(--border);border-radius:14px">
      <div class="items" id="clist" style="margin-top:12px">${clientItems(filterClients())}</div>`;
  }
  function clientItems(list) {
    return list.length ? list.map(c => `<button class="item" style="text-align:left" onclick="openClient('${esc(c.key)}')">
        <div class="item-emoji">👤</div>
        <div><div class="item-name">${esc(c.name)}</div><div class="item-sub">${esc(c.phone)} · ${c.visits} ${c.visits === 1 ? 'visita' : 'visites'}${c.noShows ? ` · <b style="color:var(--new)">${c.noShows} sense venir</b>` : ''}</div>
          ${c.next ? `<div class="item-sub">Propera: <b>${esc(dayLabel(c.next.date) || fmtDay(c.next.date, { day: 'numeric', month: 'short' }))} · ${c.next.time}</b></div>` : ''}</div>
        <span style="font-size:1.4rem;color:var(--muted)">›</span></button>`).join('')
      : `<div class="empty"><span>👥</span>${search.trim() ? 'Cap client amb aquest nom o telèfon.' : 'Encara no hi ha clients. Apareixeran quan facin la primera reserva.'}</div>`;
  }
  function openClient(key) {
    const c = customers().find(x => x.key === key);
    const hist = [...c.appts].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 12);
    const st = { confirmada: 'Pendent', feta: '✓ Ha vingut', 'no-presentat': 'No va venir', 'cancel·lada': 'Cancel·lada' };
    Panel.modal(`<h3>${esc(c.name)}</h3>
      ${c.phone ? `<div class="p-row" style="margin-top:6px"><a class="p-btn ok" style="text-align:center;text-decoration:none" href="tel:${esc(c.phone)}">📞 Trucar</a></div>` : ''}
      <div class="kv"><span>Telèfon</span><b>${esc(c.phone || '—')}</b></div>
      ${c.email ? `<div class="kv"><span>Email</span><b>${esc(c.email)}</b></div>` : ''}
      <div class="kv"><span>Visites</span><b>${c.visits}</b></div>
      <div class="kv"><span>Ha gastat</span><b>${fmtPrice(c.spent)}</b></div>
      <div class="kv"><span>Cops que no ha vingut</span><b>${c.noShows}</b></div>
      <label>Últimes cites</label>
      ${hist.map(a => `<div class="kv"><span>${esc(fmtDay(a.date, { day: 'numeric', month: 'short' }))} · ${a.time}<br>${esc(svcName(a))}</span><b>${st[a.status]}</b></div>`).join('')}
      <div class="p-row"><button class="p-btn sec" onclick="Panel.closeModal()">Tancar</button></div>`);
  }

  // ---------- Serveis ----------
  function viewServeis() {
    const step = client.slotMinutes || 15, fill = client.fillGaps !== false;
    return `<h2>Serveis i preus</h2><p class="sub">Toca el preu o la durada per canviar-los. L'interruptor amaga o mostra el servei a la pàgina de reserves.</p>
      <div class="group-title">⏱️ Cada quant dones hora</div>
      <div class="item" style="display:block">
        <p class="item-sub" style="margin:0 0 10px">Les hores que veuran els clients per reservar: cada <b>${step} minuts</b>, a partir de l'hora d'obrir.</p>
        <div class="choices">${[10, 15, 20, 30, 45, 60].map(m => `<button class="${m === step ? 'on' : ''}" onclick="setStep(${m})">${m < 60 ? m + ' min' : '1 hora'}</button>`).join('')}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <span><b>No deixar forats</b><br><span class="item-sub">Ofereix també l'hora just quan acaba una cita. Exemple: si a les 10:00 hi ha una barba de 15 min, també es podrà reservar a les 10:15.</span></span>
          <div class="sell"><button class="switch ${fill ? 'on' : ''}" onclick="toggleFill()" aria-label="No deixar forats"></button>${fill ? 'Sí' : 'No'}</div>
        </div>
      </div>
      ${client.categories.map(c => {
        const list = client.services.map((s, i) => ({ s, i })).filter(x => x.s.cat === c.id);
        return list.length ? `<div class="group-title">${esc(tr(c.name, L))}</div><div class="items">${list.map(({ s, i }) => `
          <div class="item ${s.active === false ? 'off' : ''}"><div class="item-emoji">${esc(s.emoji)}</div>
            <div><div class="item-name">${esc(tr(s.name, L))}</div>
              <div class="item-sub">${fmtPrice(s.price)}<button class="linkbtn" onclick="askPrice(${i})">Canviar preu</button></div>
              <div class="item-sub">${s.duration} minuts<button class="linkbtn" onclick="askDuration(${i})">Canviar durada</button></div></div>
            <div class="sell"><button class="switch ${s.active !== false ? 'on' : ''}" onclick="toggleService(${i})" aria-label="Mostrar o amagar"></button>${s.active !== false ? 'Es reserva' : 'Amagat'}</div>
          </div>`).join('')}</div>` : '';
      }).join('')}`;
  }
  function saveSetting(patch, msg) {
    Promise.resolve(Store.saveSettings(slug, patch)).catch(() => Panel.toast('⚠️ No s\'ha pogut desar. Revisa la connexió.'));
    client = Store.config; Panel.toast(msg); render();
  }
  function setStep(m) { saveSetting({ slotMinutes: m }, `Ara dones hora cada ${m < 60 ? m + ' minuts' : 'hora'}`); }
  function toggleFill() { const on = client.fillGaps !== false; saveSetting({ fillGaps: !on }, on ? 'Només les hores de la graella' : 'Ja no quedaran forats'); }
  function saveS(i, patch) {
    client.services[i] = { ...client.services[i], ...patch };
    Promise.resolve(Store.saveServices(slug, client.services)).catch(() => Panel.toast('⚠️ No s\'ha pogut desar. Revisa la connexió.'));
    render();
  }
  function toggleService(i) { const on = client.services[i].active !== false; saveS(i, { active: !on }); Panel.toast(on ? 'Amagat de la pàgina de reserves' : 'Ja es pot reservar'); }
  function askPrice(i) {
    const s = client.services[i];
    Panel.modal(`<h3>Preu de ${esc(tr(s.name, L))}</h3><input class="big" id="pv" type="number" inputmode="decimal" step="0.5" min="0" value="${s.price}">
      <div class="p-row"><button class="p-btn sec" onclick="Panel.closeModal()">Tornar</button><button class="p-btn main" onclick="savePrice(${i})">Desar</button></div>`);
  }
  function savePrice(i) {
    const v = Math.round((parseFloat(String($('pv').value).replace(',', '.')) || 0) * 100) / 100;
    saveS(i, { price: Math.max(0, v) }); Panel.closeModal(); Panel.toast('Preu desat');
  }
  function askDuration(i) {
    const s = client.services[i];
    const lab = m => m < 60 ? m + ' min' : (m % 60 ? (m / 60).toFixed(1).replace('.', ',') : m / 60) + ' h';
    Panel.modal(`<h3>Quant dura ${esc(tr(s.name, L))}?</h3><div class="choices">${[15, 20, 30, 45, 60, 75, 90, 120, 150, 180].map(m =>
      `<button class="${m === s.duration ? 'on' : ''}" onclick="saveS(${i},{duration:${m}});Panel.closeModal();Panel.toast('Durada desada')">${lab(m)}</button>`).join('')}</div>
      <div class="p-row"><button class="p-btn sec" onclick="Panel.closeModal()">Tornar</button></div>`);
  }

  // ---------- Reserves noves des d'internet ----------
  function checkNew() {
    const appts = Store.getAppts(slug);
    if (knownIds) {
      const fresh = appts.filter(a => !knownIds.has(a.id) && a.source === 'online');
      if (fresh.length) {
        fresh.forEach(a => flashIds.add(a.id));
        Panel.beep();
        const a = fresh[fresh.length - 1];
        Panel.toast(`🔔 Nova reserva: ${a.customer.name}, ${dayLabel(a.date) || fmtDay(a.date, { day: 'numeric', month: 'short' })} a les ${a.time}`);
        setTimeout(() => fresh.forEach(x => flashIds.delete(x.id)), 4000);
      }
      const cancelled = appts.filter(a => a.status === 'cancel·lada' && a.cancelledBy === 'client' && !knownCancelled.has(a.id));
      if (cancelled.length) { Panel.beep(); Panel.toast(`❌ ${cancelled[0].customer.name} ha cancel·lat la cita de les ${cancelled[0].time}`); }
    }
    knownIds = new Set(appts.map(a => a.id));
    knownCancelled = new Set(appts.filter(a => a.status === 'cancel·lada').map(a => a.id));
    const n = appts.filter(a => a.date === today() && a.status === 'confirmada').length;
    $('dot').hidden = !n; $('dot').textContent = n;
  }

  // ---------- Caixa (shared/caixa.js) ----------
  // La Caixa treballa amb "comandes"; cada cita en fa de comanda: el dia i l'hora de la cita, el preu del
  // servei, i les marcades com a "feta" compten com a cobrades en aquell moment (si no s'ha dit el contrari).
  // Les no presentades i les cancel·lades no compten.
  const apptTs = a => new Date(`${a.date}T${a.time || '00:00'}`).getTime();
  function asOrder(a) {
    const paid = a.paidAt !== undefined ? a.paidAt : a.status === 'feta' ? apptTs(a) : null;
    return { ...a, createdAt: apptTs(a), total: a.price || 0, num: a.num || a.code || '', paidAt: paid,
      status: a.status === 'no-presentat' ? 'cancel·lada' : a.status, realStatus: a.status, _appt: a };
  }
  const caixaStore = {
    get remote() { return Store.remote; },
    get biz() { return Store.biz; },
    getOrders: s => Store.getAppts(s).map(asOrder),
    setPaid: (s, id, paidAt, cur) => Store.setApptPaid(s, id, paidAt, cur && cur._appt),
    getCosts: s => Store.getCosts(s),
    saveCosts: (s, c) => Store.saveCosts(s, c)
  };
  const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function initCaixa() {
    Caixa.init({
      store: caixaStore, slug,
      words: { one: 'cita', many: 'cites', Title: 'Cita', things: 'serveis', thing: 'servei', ofThings: 'dels serveis', noPay: true, costHint: 'Posa el que et costa fer-lo (productes, tints, material…).' },
      items: o => [{ key: o.serviceId, qty: 1, label: o.serviceName || (svc(o.serviceId) ? tr(svc(o.serviceId).name, 'ca') : 'Servei') }],
      who: o => { const p = client.staff.find(s => s.id === o.staffId); return (o.customer ? o.customer.name : '') + (p ? ' · ' + p.name : ''); },
      payLabel: () => '',
      statusText: o => ({ confirmada: 'Pendent', feta: 'Feta', 'no-presentat': 'No ha vingut', 'cancel·lada': 'Cancel·lada' })[o.realStatus] || o.realStatus,
      costItems: () => client.services.map(s => ({ key: s.id, name: tr(s.name, 'ca'), price: s.price })),
      modal: Panel.modal, closeModal: Panel.closeModal, toast: Panel.toast, render,
      rangeFetch: Store.remote ? (from, to) => Remote.ownerApptsByDate(Store.biz.id, isoDay(new Date(from)), isoDay(new Date(to))).then(l => l.map(asOrder)) : null
    });
  }
  const viewCaixa = () => Panel.trialBanner(Store.biz) + `<p class="c-meta" style="margin:4px 0 12px">Les cites marcades com a <b>Feta</b> compten com a cobrades. Si algú no ha pagat, toca «desfer».</p>` + Caixa.view();

  function resetDemo() {
    Panel.ask('Reiniciar la demo?', 'Tornarà a l\'estat inicial i s\'esborraran les cites i canvis que hagis fet.', 'Sí, reiniciar', async () => {
      localStorage.removeItem(Store.key(slug, 'appts')); Store.resetServices(slug);
      client = await Store.loadClient(slug); knownIds = null; day = today(); render();
    }, false);
  }

  function render() {
    checkNew();
    document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('fab').hidden = tab !== 'agenda';
    $('main').innerHTML = { agenda: viewAgenda, clients: viewClients, serveis: viewServeis, caixa: viewCaixa }[tab]();
  }
  $('tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); } });

  // Negoci real (servidor): primer el propietari ha d'entrar amb el seu compte.
  function start() {
    if (Remote.isRemote(slug)) {
      return Remote.ownerStart(slug, async biz => { await Store.attachOwner(biz); setup(Store.config); },
        () => { $('main').innerHTML = '<p class="offline-msg"><span>🔍</span>No s\'ha trobat aquest negoci.</p>'; });
    }
    Store.loadClient(slug).then(setup).catch(() => { $('main').innerHTML = '<p>No s\'ha trobat aquest negoci.</p>'; });
  }
  function setup(c) {
    client = c;
    initCaixa();
    document.documentElement.style.setProperty('--brand', c.color);
    document.querySelector('meta[name=theme-color]').content = c.color;
    $('logo').innerHTML = Brand.logo(c); $('bname').textContent = c.name;
    if (Store.remote) {
      Brand.homeScreen(c, true);
      // Editar l'app sencera (productes, fotos, horaris…) amb l'assistent, sense canviar l'enllaç ni el QR.
      const ed = Object.assign(document.createElement('a'), { href: '../../crea/?editar=' + encodeURIComponent(slug), textContent: '✏️ Editar', title: 'Editar l’app: productes, fotos, colors, horaris…' });
      document.querySelector('.p-actions, .top-actions').prepend(ed);
    }
    document.title = 'Panell · ' + c.name;
    $('reset-demo').hidden = !c.demoSeed;
    $('public-link').href = `index.html?c=${encodeURIComponent(slug)}`;
    Panel.lock({ app: 'reservafacil', client: c, onUnlock: () => {
      render();
      const idle = () => !Panel.modalOpen() && document.activeElement?.id !== 'search';
      Store.onChange(async () => { if (!Store.remote) client = await Store.loadClient(slug); if (idle()) render(); else checkNew(); });
      setInterval(() => { if (idle()) render(); }, 60000);
    } });
  }
  start();
</script>
</body>
</html>
